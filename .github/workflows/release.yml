# Builds kasset for every platform below, tests each native build, and
# packages one archive per platform.
#
# - Pushing a tag like `v0.2.0` publishes a GitHub Release with the archives
#   plus a SHA256SUMS file, as an official release marked latest (never a
#   pre-release). The tag must match `version` in Cargo.toml.
# - A dry run (the "Run workflow" button / `gh workflow run Release`, or a pull
#   request touching the build setup) does everything except publishing; the
#   archives are kept as run artifacts so they can be downloaded and tried.
#
# The build deliberately uses no dependency cache, so release binaries never
# build from a cache another branch wrote.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - .cargo/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Supersede older dry runs of the same PR, but never cut a release short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-22.04
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Pick the archive label
        id: label
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kasset") | .version')
          if [ "$EVENT" = push ]; then
            if [ "v$version" != "$TAG" ]; then
              echo "::error::tag $TAG does not match Cargo.toml version $version"
              exit 1
            fi
            label="$TAG"
          else
            label="v$version-dev.${SHA:0:7}"
            echo "::notice::dry run: archives are labelled $label and nothing is published"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04 links against an older glibc, so the binary also
          # runs on older distributions.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            test: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            test: true
          - target: aarch64-apple-darwin
            os: macos-latest
            test: true
          # Cross-compiled on Apple Silicon; tests can't run natively there.
          - target: x86_64-apple-darwin
            os: macos-latest
            test: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            test: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        env:
          LABEL: ${{ needs.prepare.outputs.label }}
          TARGET: ${{ matrix.target }}
        run: |
          name="kasset-$LABEL-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/kasset" README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LABEL: ${{ needs.prepare.outputs.label }}
          TARGET: ${{ matrix.target }}
        run: |
          $name = "kasset-$env:LABEL-$env:TARGET"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/$env:TARGET/release/kasset.exe", README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    # Only a pushed tag publishes; dry runs stop after the builds.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum kasset-* > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --latest --title "kasset $TAG" --generate-notes dist/*
